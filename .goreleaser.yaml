version: 2
project_name: kie-cli
changelog:
  disable: true
builds:
  - id: kie-cli
    main: ./cmd/kie-cli
    binary: kie-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X kie-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: kie-mcp
    main: ./cmd/kie-mcp
    binary: kie-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: kie-cli
    repository:
      owner: boris-korol
      name: homebrew-tap
    homepage: "https://github.com/BKproduct/kie-cli"
    description: "Unified job API for KIE.ai market models (image/video generation). Bearer token from https://kie.ai/api-key — env..."
    install: |
      bin.install "kie-cli"
      bin.install "kie-mcp"
